name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: packages/exr-wasm/scripts/build-wasm.sh
      - run: pnpm build
      - name: Version PR or publish
        uses: changesets/action@v2
        with:
          publish-script: scripts/publish.sh
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
