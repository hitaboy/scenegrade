name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      # Static FFmpeg (BtbN GPL build: x264, x265, SVT-AV1, prores_ks). Avoids apt, whose
      # Ubuntu mirrors on the runners are sometimes down.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 4 --retry-delay 5 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg" -hide_banner -encoders | grep -E "libx264|libx265|libsvtav1|prores_ks"

      - run: pnpm install --frozen-lockfile

      - name: Cache OpenEXR WASM build
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: packages/exr-wasm/dist-wasm
          key: exr-wasm-${{ hashFiles('packages/exr-wasm/scripts/**', 'packages/exr-wasm/src-c/**') }}
      - name: Build OpenEXR → WASM (Docker, emscripten/emsdk)
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: packages/exr-wasm/scripts/build-wasm.sh

      - name: Generate test media
        run: pnpm media

      - name: Verify the committed ACES LUTs are reproducible
        run: |
          pnpm bake:luts
          # OCIO's CPU path is not bit-identical across platforms: compare within float noise.
          pnpm bake:check

      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

      - name: E2E (Chromium, WebGPU via SwiftShader)
        timeout-minutes: 15
        env:
          PW_CHROMIUM: '1'
        run: |
          pnpm --filter @scenegrade/demo exec playwright install --with-deps chromium
          pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/demo/test-results
