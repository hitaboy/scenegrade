name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      # Static FFmpeg (BtbN GPL build: x264, x265, SVT-AV1, prores_ks). Avoids apt, whose
      # Ubuntu mirrors on the runners are sometimes down.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 4 --retry-delay 5 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg" -hide_banner -encoders | grep -E "libx264|libx265|libsvtav1|prores_ks"
      - run: pnpm install --frozen-lockfile
      - run: packages/exr-wasm/scripts/build-wasm.sh
      - run: pnpm media
      - name: Build demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/
        run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist
      - id: deployment
        uses: actions/deploy-pages@v5
